name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Judhur.slnx

      - name: Build
        run: dotnet build Judhur.slnx -c Release --no-restore

      - name: Domain unit tests
        run: dotnet test tests/Judhur.Domain.UnitTests -c Release --no-build --logger "trx;LogFileName=domain.trx" --results-directory TestResults

      - name: Application unit tests
        run: dotnet test tests/Judhur.Application.UnitTests -c Release --no-build --logger "trx;LogFileName=application.trx" --results-directory TestResults

      - name: Integration, request and end-to-end tests (SQL Server in Docker)
        run: dotnet test tests/Judhur.Api.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Migrations match the model
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=Judhur;User Id=sa;Password=x;TrustServerCertificate=True"
          JwtSettings__Secret: ci-only-signing-key-that-is-long-enough-0123456789
          JwtSettings__Issuer: ci
          JwtSettings__Audience: ci
          JwtSettings__TokenExpirationInMinutes: "15"
          CloudinarySettings__CloudName: ci
          CloudinarySettings__ApiKey: ci
          CloudinarySettings__ApiSecret: ci
          EmailPassword: ci
          Google__ClientId: ci.apps.googleusercontent.com
          Cors__AllowedOrigins__0: http://localhost:5173
          Frontend__ConfirmEmailUrl: http://localhost:5173/confirm-email
          AdminSeed__Email: admin@ci.test
          AdminSeed__Password: Ci#Admin2026
          AdminSeed__FullName: CI
          AdminSeed__City: CI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          dotnet ef migrations has-pending-model-changes -p src/Judhur.Infrastructure -s src/Judhur.Api --configuration Release --no-build

      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          failed = []
          for path in glob.glob("TestResults/*.trx"):
              root = ET.parse(path).getroot()
              for result in root.iterfind(".//t:UnitTestResult", ns):
                  if result.get("outcome") == "Failed":
                      message = result.find(".//t:Message", ns)
                      text = (message.text or "").strip().replace("\r", " ").replace("\n", " ")[:400] if message is not None else ""
                      failed.append((result.get("testName"), text))
          print(f"{len(failed)} failed tests")
          for name, text in failed:
              print(f"FAILED {name} :: {text}")
          for name, text in failed[:10]:
              print(f"::error title={name}::{text}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f src/Judhur.Api/Dockerfile --target final -t judhur-api:ci .
