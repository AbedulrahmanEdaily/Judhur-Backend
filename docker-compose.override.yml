services:
  judhur-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTPS_PORTS: "7000"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/judhur.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD:?CERT_PASSWORD is missing in .env}
      ForwardedHeaders__Enabled: "false"
    ports:
      - "7000:7000"
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro

  sqlserver:
    ports:
      - "1433:1433"
